<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Load -->

  <!-- Satoshi -->
  <link rel="preload" href="../fonts/Satoshi-Regular.otf" as="font" type="font/otf" crossorigin="anonymous">
  <link rel="preload" href="../fonts/Satoshi-Bold.otf" as="font" type="font/otf" crossorigin="anonymous">
  <link rel="preload" href="../fonts/Satoshi-Italic.otf" as="font" type="font/otf" crossorigin="anonymous">
  <link rel="preload" href="../fonts/Satoshi-BoldItalic.otf" as="font" type="font/otf" crossorigin="anonymous">

  <!-- Fira Mono -->
  <link rel="preload" href="../fonts/FiraMono-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <link rel="preload" href="../fonts/FiraMono-Medium.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <link rel="preload" href="../fonts/FiraMono-Bold.ttf" as="font" type="font/ttf" crossorigin="anonymous">

  <link rel="stylesheet" href="../css/index.css">

  <link rel="stylesheet" href="../css/header.css">

</head>
<body>


  <div class="popup-card">
    <button class="close-btn">X</button>
    <header class="popup-header-container">
      <h2>VerifAI</h2>
      <a href="#">How we check information</a>
      <i>The highlighted text is "<span class="highlighted-text-js"></span>"</i>
    </header>
    <main class="popup-state-js">
      <div class="verdict-container">
      <i>Verdict: <h2 class="verdict-result">${verdictText}</h2></i>
    <div class="explanation-container">
      <textarea class="explanation-js" readonly>${explanation}</textarea>
    </div>
      </div>
    <div class="links-container">
      <p>Supporting Articles:</p>
      <ul>${linksHtml}</ul>
    </div>
    </main>

  </div>
  

</body>
</html>
